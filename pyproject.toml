[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nasiko-redteam-loop"
version = "0.1.0"
description = "A local red-team vs blue-team evaluation loop for Nasiko agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100",
    "httpx>=0.28,<1",
    "pydantic>=2",
    "typer>=0.12",
]

[project.scripts]
redteam = "cli.main:app"

[project.optional-dependencies]
dev = [
    "a2a-sdk[http-server]==1.1.0",
    "click==8.4.1",
    "pytest>=8",
    "ruff>=0.5",
    "uvicorn==0.48.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "attacks*", "cli*", "core*", "targets*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
